<script>
/* --- Turn this page into an installable PWA (no external files needed) --- */
(function(){
  try{
    var iconSVG = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>"
      + "<rect width='512' height='512' rx='96' fill='#02040c'/>"
      + "<text x='256' y='340' font-size='300' text-anchor='middle'>🚀</text></svg>";
    var iconURL = "data:image/svg+xml;base64," + btoa(iconSVG);
    var manifest = {
      name: "ROCKET RUN", short_name: "Rocket Run",
      description: "An endless 3D space survival runner.",
      start_url: location.pathname + location.search,
      scope: location.pathname.replace(/[^/]*$/, ''),
      display: "fullscreen", orientation: "any",
      background_color: "#02040c", theme_color: "#02040c",
      icons: [
        {src: iconURL, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}
      ]
    };
    var blob = new Blob([JSON.stringify(manifest)], {type:"application/json"});
    var link = document.createElement("link");
    link.rel = "manifest"; link.href = URL.createObjectURL(blob);
    document.head.appendChild(link);

    // Minimal offline-friendly service worker so the browser treats this as installable.
    if("serviceWorker" in navigator){
      var swSrc = "self.addEventListener('install',e=>self.skipWaiting());"
        + "self.addEventListener('activate',e=>self.clients.claim());"
        + "self.addEventListener('fetch',e=>{});"; // pass-through; page is fully self-contained
      var swBlob = new Blob([swSrc], {type:"application/javascript"});
      var swURL = URL.createObjectURL(swBlob);
      window.addEventListener("load", function(){
        navigator.serviceWorker.register(swURL).catch(function(){});
      });
    }
  }catch(e){ /* PWA setup is best-effort; game still runs fine without it */ }
})();
</script>
